services:
  - type: web
    name: lytica-sourcing-leverage-check
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: LEAD_WEBHOOK_URL
        sync: false
